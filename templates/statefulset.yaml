apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloak
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version}}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/component: keycloak
      app.kubernetes.io/instance: keycloak
      app.kubernetes.io/name: keycloak
  serviceName: keycloak-headless
  template:
    metadata:
      annotations:
        checksum/configmap-env-vars: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/component: keycloak
        app.kubernetes.io/instance: keycloak
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: keycloak
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version}}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: keycloak
                  app.kubernetes.io/name: keycloak
              topologyKey: kubernetes.io/hostname
            weight: 1
      automountServiceAccountToken: true
      {{- if .Values.initContainers }}
      initContainers:
      {{- toYaml .Values.initContainers | nindent 6 -}}
      {{- end }}
      containers:
      {{- if .Values.sidecars -}}
      {{ toYaml .Values.sidecars | nindent 6 -}}
      {{- end }}
      - name: keycloak
        image: {{ default "keycloak/keycloak" .Values.image.repository }}:{{ default "latest" .Values.image.tag }}
        imagePullPolicy: IfNotPresent
        ## --optimized skips the Quarkus re-augmentation on boot. It requires an
        ## image that already ran `kc.sh build` with the providers/themes baked
        ## in -- see Dockerfile.keycloak in fermyon/kc-allowban-plugin.
        args:
        - "start"
        - "--optimized"
        - "--import-realm"
        - --spi-authenticator-allow-ban-check-authenticator-dbpath=/opt/keycloak/allowbans
        - --spi-theme-welcome-theme=keycloak-welcome-theme
        {{- if .Values.metrics.enabled }}
        - --metrics-enabled=true
        {{- end }}
        envFrom:
        - configMapRef:
            name: keycloak-env-vars
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_HOSTNAME_STRICT
          value: 'false'
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: JAVA_OPTS_APPEND
          value: '-Djgroups.bind.address=$(POD_IP)'
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-creds
              key: password
              optional: false
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.db.existingSecret }}
              key: {{ .Values.db.existingSecretPasswordKey }}
              optional: false
        {{- if .Values.extraEnvVars -}}
        {{ toYaml .Values.extraEnvVars | nindent 8 -}}
        {{- end }}
        ports:
          - name: http
            containerPort: 8080
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 300
          periodSeconds: 1
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 5
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9000
          name: metrics
          protocol: TCP
        - containerPort: 7800
          name: discovery
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /realms/master
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            ephemeral-storage: {{ .Values.resources.requests.ephemeralStorage }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            ephemeral-storage: {{ .Values.resources.limits.ephemeralStorage }}
            memory: {{ .Values.resources.limits.memory }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
          seLinuxOptions: {}
          seccompProfile:
            type: RuntimeDefault
        ## conf/, lib/quarkus/, providers/ and themes/ are only read at runtime
        ## and now ship complete in the image, so they stay on the read-only
        ## rootfs. Only /tmp and data/ are ever written to.
        volumeMounts:
        - mountPath: /tmp
          name: empty-dir
          subPath: tmp-dir
        - mountPath: /opt/keycloak/data
          name: empty-dir
          subPath: app-data-dir
        {{- if .Values.extraVolumeMounts -}}
        {{ toYaml .Values.extraVolumeMounts | nindent 8 -}}
        {{- end }}
      {{ if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      - name: regcred-keycloak
      {{- end }}
      restartPolicy: Always
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
      serviceAccount: keycloak
      serviceAccountName: keycloak
      volumes:
      - name: empty-dir
        emptyDir: {}
      {{- if .Values.extraVolumes -}}
      {{ toYaml .Values.extraVolumes | nindent 6 -}}
      {{- end }}
